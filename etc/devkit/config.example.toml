# Copia a config.toml (ese archivo es local y no va a git):
#   copy etc\devkit\config.example.toml etc\devkit\config.toml
#
# Si no existe config.toml, DevKit lo crea con estos defaults al arrancar.
# Para convivir con Laragon, sube los puertos (ej. 8082 / 3307 / 6380 / 8026).

bind = "127.0.0.1"
http_port = 8080
https_port = 8443
php_port = 9000
mysql_port = 3306
redis_port = 6379
mailpit_smtp = 1025
mailpit_ui = 8025
php_version = "8.3"
ssl = false
tld = "test"
follow_www_junctions = true
php_extensions = [
    "mysqli",
    "pdo_mysql",
    "pdo_sqlite",
    "sqlite3",
    "openssl",
    "mbstring",
    "curl",
    "fileinfo",
    "zip",
    "gd",
    "intl",
    "exif",
]
